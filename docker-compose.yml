version: "3.9"

services:
  client:
    build: ./Client
    container_name: test_vite_app
    ports:
      - "5173:5173"
    stdin_open: true
    tty: true
    depends_on:
      - server
    volumes:
      - ./Client:/app
      - /app/node_modules

  server:
    build: ./Server
    container_name: test_express_app
    ports:
      - "5002:5002"
    volumes:
      - ./Server:/app
      - /app/node_modules
    restart: always